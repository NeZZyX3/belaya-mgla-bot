# belaya-mgla-bot: build the RU-layer bot image on top of the official
# Autopilot image and publish it to ghcr.io/<owner>/belaya-mgla-bot/bot:latest.
# Runs on RU-layer changes, daily (to pick up upstream releases) and on demand.
name: ru-image

on:
  push:
    branches: [main]
    paths:
      - "ru/**"
      - ".github/workflows/ru-image.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ru-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/bot
          tags: |
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ru/Dockerfile.bot
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
